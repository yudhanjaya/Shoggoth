# The models Shoggoth recommends. Edit this file to change the cards; nothing else needs to change.
#
# Check your edits with:   python3 shoggoth/server.py recommendations check
# Shoggoth reads the file again when it changes: refresh the page to see the new cards.
# A copy at ~/.local/share/shoggoth/recommendations/models.yaml is used instead of this one.
#
# Text may use `code` and [links](https://example.com). A link to #skills, #models, #server... opens that page in Shoggoth.

version: 1

# Models > "Recommended for this computer". A card shows when it fits this computer, whether or not the engine is installed yet: `title`,
# `size_gb`, `tools`, `vision` and `reasoning` are what the card says until the engine can list the model itself, and `size_gb` sorts it
# into Small (under 10 GB), Medium (10 to 24 GB) or Large. `id` is the engine's name for the model (`also`: the same model under another
# name). `download` is for a model the engine does not list: where to fetch it (a Hugging Face `checkpoint`, and optionally `mmproj` for
# pictures). `label` is an optional chip on the card (it also shows in the chat's model picker), `take` the text. The cards keep this order.
# Text is the owner's own words; do not paraphrase it. No speed figures: they can't be predicted for other people's computers.
recommended:
  # Small: runs on almost any computer, starts in seconds.
  - id: LFM2.5-8B-A1B
    title: LFM2.5-8B-A1B
    size_gb: 5.2
    tools: true
    take: >-
      Competent all-rounder. Terse language, handles tool calls reasonably well, fast - an excellent all-round pick.
  # Not in Lemonade's list: Shoggoth fetches the bartowski Q4_K_M and adds it as a custom model. It needs Lemonade 2026.41.1 or newer
  # (llama.cpp b11393 or later), which fixed MiMo's tool-call template detection.
  - id: user.MiMo-V2.6-Distill-Qwen-9B-Q4_K_M
    also: [MiMo-V2.6-Distill-Qwen-9B-Q4_K_M]      # Lemonade lists a custom model without the `user.` it is added under
    title: MiMo-V2.6-Distill-Qwen-9B
    size_gb: 5.84
    tools: true
    download:
      checkpoint: bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF:MiMo-V2.6-Distill-Qwen-9B-Q4_K_M.gguf
    take: >-
      An upgraded version of Qwen 9B. Improved tool calling, managed to pass our code debug tests without issues. A little verbose:
      tends to go on at length, prone to looping sometimes.
  - id: Gemma-4-12B-it-MTP-GGUF
    title: Gemma-4-12B-it (MTP)
    size_gb: 7.75
    tools: true
    vision: true
    take: >-
      Arguably the best conversationalist of the lot at this size; perhaps not the best at tool-calling. Lacks nuanced reasoning and may
      hallucinate wildly in long-context tasks.

  # Medium
  - id: Qwen3.6-35B-A3B-MTP-GGUF
    title: Qwen3.6-35B-A3B (MTP)
    size_gb: 23.8
    tools: true
    vision: true
    take: >-
      The current king of getting shit done on a single GPU. A Mixture-of-Experts model that only activates 3B of its 35B parameters;
      exceptional tool calling for its size. Very AI-esque conversation, but the default pick.
  - id: Gemma-4-26B-A4B-it-MTP-GGUF
    title: Gemma-4-26B-A4B-it (MTP)
    size_gb: 18.5
    tools: true
    vision: true
    take: >-
      The alternate to Qwen 3.6. Slightly smaller, but excellent at long-context tasks, multilingual work and reasoning; not as good at
      Qwen at coding tasks.
  - id: GLM-4.7-Flash-GGUF
    title: GLM-4.7-Flash
    size_gb: 17.5
    tools: true
    take: >-
      A fast model but a prolific bullshitter. Hallucinates wildly, especially if you give it coding or tool-calling tasks. Run if you
      prefer its writing style or can't run Qwen.
  - id: Gemma-4-31B-it-MTP-GGUF
    title: Gemma-4-31B-it (MTP)
    size_gb: 20.0
    tools: true
    vision: true
    take: >-
      Excels at conversation, writing, and general tasks; is not as good as the Qwen models at tool-calling, agentic work, or coding.
      Good balance of speed and power; think of it as Gemini's Flash model in a box.
  - id: Qwen3.8-27B-GGUF
    title: Qwen3.8-27B
    size_gb: 18.8
    tools: true
    vision: true
    reasoning: true
    take: >-
      Excellent at coding for its size, but utterly neurotic and slow. Empires have risen and fallen in the time it takes to respond.
      Use if you're very patient.

# Large models are the `strata` list below. Models that are not ready yet show greyed out with a COMING SOON! label.
coming_soon:
  - title: LFM3
    take: >-
      Incredibly small, all-purpose models, extremely competent in my testing, punching well above their size. Will be included once
      Lemonade updates its llama.cpp.
  - title: GLM 5.3 Flash
    take: >-
      Much better model, but much slower. Comparable to Claude Opus 4.8 (which often did better work than Opus 5) and OpenAI GPT Terra 5.6
      on many tasks. Will be added once I integrate Project Maya.

# The first-run screen: "Choose your first model", one card per size. Each size shows the first model in `models` that this
# computer can run. `recommended: true` marks the one Shoggoth suggests. The large card is Strata's suggestion (from `strata` below).
first_run:
  - size: small
    models: [LFM2.5-8B-A1B]
    blurb: Answers fast and keeps it short. Runs on almost any computer.
    start: Ready in seconds
  - size: medium
    models: [Qwen3.6-35B-A3B-MTP-GGUF, Gemma-4-26B-A4B-it-MTP-GGUF, Gemma-4-31B-it-MTP-GGUF]
    blurb: "My general pick: fast, and good at everyday tasks, research and simple code."
    start: Ready in seconds
    recommended: true
  - size: large
    engine: strata
    blurb: The most capable, for a big computer. It takes a couple of minutes to start.
    start: About 2 minutes to start

# Very large models that Strata downloads and sets up itself (Large in the Library). `family` and `model` are Strata's own names
# (`strata launch --family F --model M`). `need_gb` is the RAM plus graphics memory the weights need: it decides whether the model
# fits. The suggestion is the first one, best quality first, that fits; `suggest: false` lists a model without ever suggesting it.
strata:
  # Qwen3.8 Flash-Next from ISTA-DASLab, Strata's recommended provider (Strata's docs/MODELS.md, "Pick by memory").
  - family: qwen
    model: IQ3_S
    title: "Qwen3.8 Flash-Next, best quality"
    need_gb: 54.8
    ctx: 131072
    take: >-
      One of the closest options we have to a frontier model experience at home, thanks to Strata. Blazing fast (often as fast as some of
      the medium models), roughly comparable to Claude Sonnet 5 for agentic work and code. You need at least 64 GB of RAM and a 12 GB GPU
      to run this.
  - {family: qwen, model: IQ3_XXS, title: "Qwen3.8 Flash-Next, great quality", need_gb: 47.0, ctx: 131072}
  - {family: qwen, model: IQ2_XS, title: "Qwen3.8 Flash-Next, balanced", need_gb: 39.2, ctx: 131072}
  - {family: qwen, model: Q2_0, title: "Qwen3.8 Flash-Next, fastest", need_gb: 37.6, ctx: 131072}
  # 257 GB of disk and a fixed 8K window: listed, never suggested.
  - family: deepseek41
    model: IST-DAS-2.00bpw
    title: "DeepSeek V4.1 Flash (very large, 8K window)"
    need_gb: 46.0
    ctx: 8192
    min_vram_gb: 12
    disk_gb: 270
    suggest: false
    take: >-
      The darling of token-maxxers. DeepSeek approaches Claude Opus 5 quality (though not quite there), but expect it to be slow on all
      but the most serious hardware. This one requires some serious hardware - if you need to run it, you need to do some reading.
