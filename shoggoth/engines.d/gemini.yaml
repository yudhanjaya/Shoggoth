# A definition is data: it names an engine and says how to recognise it. It can start, install or run nothing, and engines.py refuses any key outside its schema.
id: gemini
name: Google Gemini
category: hosted
summary: Google's Gemini models, through its OpenAI-style endpoint.
url: https://generativelanguage.googleapis.com/v1beta/openai/
formats:
  # Pi's openai-completions drops the thought signature Gemini puts on each tool call, so Gemini models use Google's own format.
  - {api: google-generative-ai}
key: required
key_url: https://aistudio.google.com/apikey
docs: https://ai.google.dev
terms: https://ai.google.dev/gemini-api/terms
price: "A free tier with rate limits, and paid use after it."
hint: "Paste your key from Google AI Studio. The free tier has rate limits."
