id: unsloth
name: Unsloth
category: local
summary: Unsloth's local server.
match: [unsloth]
formats:
  - {api: openai-completions}
loads: fixed
key: optional
docs: https://github.com/unslothai/unsloth
hint: "Use the address Unsloth prints when it starts."
