# A definition is data: it names an engine and says how to recognise it. It can start, install or run nothing, and engines.py refuses any key outside its schema.
id: llama-swap
name: llama-swap
category: local
summary: A proxy that starts the right llama-server for each model request and swaps between them.
url: http://127.0.0.1:8080
ports: [8080]
match: [llama-swap]
identify:
  - {path: /running}
formats:
  - {api: openai-completions}
loads: ollama
key: optional
docs: https://github.com/mostlygeek/llama-swap
hint: "Its usual address is port 8080, set with --listen."
