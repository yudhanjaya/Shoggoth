# A definition is data: it names an engine and says how to recognise it. It can start, install or run nothing, and engines.py refuses any key outside its schema.
id: strata
name: Strata
category: specialized
summary: Runs very large models on home hardware by splitting them across your cards and memory.
url: http://127.0.0.1:8080
ports: [8080]
match: [strata]
formats:
  - {api: openai-completions}
loads: fixed
key: optional
docs: https://github.com/Niko1221/Strata
hint: Use the address Strata prints when it starts, and its API key if it has one.
