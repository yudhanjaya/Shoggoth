# Lemonade: the fast engine. Runs most models that fit a graphics card, loads them in seconds.
id: lemonade
name: Lemonade
summary: Runs everyday models quickly (llama.cpp and others) and loads them in seconds.
tier: small-medium
api_version: 1

detect:
  binaries: [$SHOGGOTH_LEMONADE_DIR/lemond, lemond]
  ports: [13305, 13307-13326]
  health: {path: /api/v1/health}

update:
  check: {command: ["{bin}", --version]}      # Shoggoth's own check of Lemonade's releases does the real work (provider.py)

run:
  mode: managed
  start: ["{bin}", "{data}", --port, "{port}", --no-broadcast]
  ready: {path: /live, timeout: 60}
  stop_grace_secs: 20
  port_range: 13307-13326

endpoint:
  base_url: "http://127.0.0.1:{port}/api/v1"
  models: {path: /api/v1/models, id: "$.data[*].id"}

models:
  formats: [gguf]
  # Lemonade's llama.cpp does not know these; they are Strata's own architectures.
  excluded_architectures: [qwen4exp, deepseek41]
  data_dir: "{library}/lemonade"
  download: {mode: api}          # plain GGUF downloads go through Lemonade
  view: true                     # Lemonade lists any GGUF in a folder it is pointed at, so it is only pointed at a view of files it can run

memory:
  group: gpu
  exclusive: false
  max_loaded: 1
  start_estimate: {seconds: 20}

capabilities:
  context: per-load
  multi_model: true
  tuning: {builtin: zest-measure}
